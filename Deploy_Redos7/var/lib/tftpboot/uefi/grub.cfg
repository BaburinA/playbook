function load_video {
 insmod efi_gop
 insmod efi_uga
 insmod video_bochs
 insmod video_cirrus
 insmod all_video
 }
 load_video
 set gfxpayload=keep
 insmod gzio
 menuentry 'REDOS 7.3' {
 linux images/REDOS/images/pxeboot/vmlinuz ip=dhcp kernel vmlinuz inst.repo=http://192.168.0.244/images/REDOS/ inst.ks=http://192.168.0.244/ks/ks.cfg
 initrd images/REDOS/images/pxeboot/initrd.img
 }
 menuentry 'REDOS 8' {
 linux images/REDOS8/images/pxeboot/vmlinuz ip=dhcp kernel vmlinuz inst.repo=http://192.168.0.244/images/REDOS8/ inst.ks=http://192.168.0.244/ks/ks8.cfg
 initrd images/REDOS8/images/pxeboot/initrd.img
 }
