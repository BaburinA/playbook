# Установка агентов Drweb
---
- hosts: DrwebBD
  gather_facts: false
  become: true
  tasks:

  - name: Copy certificate
    ansible.builtin.copy:
      src: /home/ansible-ib/Ansible/Repos/cer.pem
      dest: ./cer.pem
      mode: '0644'

  - name: Copy Distrib Drweb
    ansible.builtin.copy:
      src: /home/ansible-ib/Ansible/Repos/drweb-workstations_11.1.3-2201141226+fstek_linux_amd64.run
      dest: ./drweb-workstations_11.1.3-2201141226+fstek_linux_amd64.run
      mode: '0644'

  - name: Installed new version Drweb
    ansible.builtin.shell: sh ./drweb-workstations_11.1.3-2201141226+fstek_linux_amd64.run -- -n

# отключаем станцию от сервера
#  - name: Disconnect old  server Drweb
#    ansible.builtin.shell: drweb-ctl esd -d

  - name: Connect new  server Drweb
#    ansible.builtin.shell: drweb-ctl esc 192.168.32.205  --Cert ./cer.pem
    ansible.builtin.shell: drweb-ctl esc 91.230.91.5:2193  --Cert ./cer.pem
#    ansible.builtin.shell: drweb-ctl esc 192.168.29.82:2193  --Cert ./cer.pem

  - name: Restarting WS Drweb
    ansible.builtin.shell: systemctl restart drweb-configd






