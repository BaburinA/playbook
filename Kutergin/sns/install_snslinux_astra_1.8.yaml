---

- name: Синхронизация файлов и установка SNS Linux
  hosts: all
  become: yes
  gather_facts: no

  vars:
    orchestrator_ip: "192.168.131.8"
    login_orch: "admin"
    password_orch: "Gtnheirf18@"
    deb_src_path: /home/distribution/szi-for-linux/sns-linux/astra_1.8
    deb_dest_path: /home/ansible-ib
    sns_deb: sns_8.2-1428.astra1.8_amd64.deb
    sns_license: lic124.lic

  vars_prompt:
    - name: reboot_after_install
      prompt: "Перезагружать хосты после установки SNS Linux? (yes/no)"
      private: no

  tasks:
    - name: Проверяем, установлен ли пакет SNS Linux
      ansible.builtin.command: dpkg-query -W -f='${Status}' sns
      register: sns_package_status
      failed_when: false
      changed_when: false

    - name: Выводим статус установки пакета
      ansible.builtin.debug:
        msg: "SNS Linux: {{ 'установлен' if 'install ok installed' in sns_package_status.stdout else 'не установлен' }}"

    - name: Определяем, был ли SNS установлен в этом запуске
      set_fact:
        was_sns_installed: "{{ 'install ok installed' not in sns_package_status.stdout }}"

    - name: Выполняем действия, если SNS Linux НЕ установлен
      block:
        - name: Получаем текущую версию ядра
          ansible.builtin.shell: uname -r
          register: kernel_version

        - name: Выводим текущую версию ядра
          ansible.builtin.debug:
            msg: "Текущее ядро: {{ kernel_version.stdout }}"

        - name: Копируем файл SNS Linux
          ansible.builtin.copy:
            src: "{{ deb_src_path }}/{{ sns_deb }}"
            dest: "{{ deb_dest_path }}/"

        - name: Копируем лицензию
          ansible.builtin.copy:
            src: "{{ deb_src_path }}/{{ sns_license }}"
            dest: "{{ deb_dest_path }}/"

        - name: Устанавливаем .deb пакет SNS Linux через dpkg -i
          ansible.builtin.command: dpkg -i "{{ deb_dest_path }}/{{ sns_deb }}"
          register: dpkg_result
          failed_when: false

        - name: Исправляем зависимости после установки dpkg
          ansible.builtin.command: apt --fix-broken install -y
          register: fix_result
          changed_when: "'0 upgraded, 0 newly installed' not in fix_result.stdout"

        - name: Перезагружаем хост, если выбрано 'yes'
          ansible.builtin.reboot:
          when: reboot_after_install | lower == "yes"

        - name: Сообщаем, что требуется перезагрузка
          ansible.builtin.debug:
            msg: "Пакет SNS Linux установлен на хосте {{ inventory_hostname }}. Требуется перезагрузка."
          when: reboot_after_install | lower == "no"
      when: was_sns_installed | bool

    # === ЗАДАЧИ ПОСЛЕ УСТАНОВКИ И ПЕРЕЗАГРУЗКИ (выполняются только если был установлен и выбрана перезагрузка) ===

    - name: Убедимся, что служба sn запущена (после перезагрузки)
      ansible.builtin.service:
        name: sn
        state: started
        enabled: yes
      when:
        - was_sns_installed | bool
        - reboot_after_install | lower == "yes"

    - name: Ждём, пока появится сокет SNS (до 60 секунд)
      ansible.builtin.wait_for:
        path: /opt/securitycode/sns/var/tmp/sn_sock
        state: present
        timeout: 60
        delay: 5
      when:
        - was_sns_installed | bool
        - reboot_after_install | lower == "yes"

    - name: Загружаем лицензию SNS Linux
      ansible.builtin.command: /opt/securitycode/sns/bin/snlicensectl -c "{{ deb_dest_path }}/{{ sns_license }}"
      register: license_result
      changed_when: true
      when:
        - was_sns_installed | bool
        - reboot_after_install | lower == "yes"

    - name: Выводим результат загрузки лицензии
      ansible.builtin.debug:
        msg: "{{ license_result.stdout_lines | regex_replace('\\n', ' ') }}"
      when:
        - was_sns_installed | bool
        - reboot_after_install | lower == "yes"

    - name: Проверяем, установлен ли python3-pexpect
      ansible.builtin.command: dpkg-query -W -f='${Status}' python3-pexpect
      register: pexpect_check
      changed_when: false
      failed_when: false

    - name: Копируем python3-pexpect
      ansible.builtin.copy:
        src: "{{ deb_src_path }}/python3-pexpect_4.8.0-4_all.deb"
        dest: "{{ deb_dest_path }}/"
      when: "'install ok installed' not in pexpect_check.stdout"

    - name: Копируем python3-ptyprocess
      ansible.builtin.copy:
        src: "{{ deb_src_path }}/python3-ptyprocess_0.7.0-5_all.deb"
        dest: "{{ deb_dest_path }}/"
      when: "'install ok installed' not in pexpect_check.stdout"

    - name: Устанавливаем python3-ptyprocess
      ansible.builtin.command: dpkg -i "{{ deb_dest_path }}/python3-ptyprocess_0.7.0-5_all.deb"
      register: ptyprocess_result
      failed_when: false
      when: "'install ok installed' not in pexpect_check.stdout"

    - name: Устанавливаем python3-pexpect
      ansible.builtin.command: dpkg -i "{{ deb_dest_path }}/python3-pexpect_4.8.0-4_all.deb"
      register: pexpect_result
      failed_when: false
      when: "'install ok installed' not in pexpect_check.stdout"

    - name: Выполнение snconnctl -s
      ansible.builtin.command:
        cmd: /opt/securitycode/sns/bin/snconnctl -s
      register: snconnctl_output
      failed_when: false  

    - name: Определить, нужно ли перерегистрировать агент в оркестраторе
      set_fact:
        need_reconnect_orch: >-
          {{
            ('Нет соединения с Security Code Orchestrator' in snconnctl_output.stdout) or
            ('Не удалось установить соединение с Security Code Orchestrator' in snconnctl_output.stdout)
          }}
      when: snconnctl_output.stdout is not none

    - name: Выполнение команды snconnctl -D после подтверждения
      expect:
        command: "sudo /opt/securitycode/sns/bin/snconnctl -D"
        responses:
          "логин:": "{{ login_orch }}"
          "пароль:": "{{ password_orch }}"
          "Подключиться к существующему объекту?": "y"
      register: disable_result
      ignore_errors: yes
      when: need_reconnect_orch is defined and need_reconnect_orch

    - name: Повторное выполнение команды подключения
      expect:
        command: "sudo /opt/securitycode/sns/bin/snconnctl --registration --ip=192.168.131.8"
        responses:
          "логин:": "{{ login_orch }}"
          "пароль:": "{{ password_orch }}"
          "Подключиться к существующему объекту?": "y"
          "Сертификат сервера будет добавлен в список доверенных сертификатов. Продолжить? [д/Н]": "y"
      register: final_registration_result
      ignore_errors: yes
      when: need_reconnect_orch is defined and need_reconnect_orch

    - name: Вывод результата подключения оркестратор
      debug:
        msg: "{{ final_registration_result.stdout | regex_replace('[\\n\\r]', ' ') | regex_replace('Введите учетные данные администратора безопасности.*?Настройки успешно сохранены', '') | regex_replace('\\+[-\\+]+\\+', '') | regex_replace('\\|', '') | regex_replace('\\s+', ' ') | regex_replace('Название агента:', '') | regex_replace('Описание агента:', '') | trim }}"
      when: >
        need_reconnect_orch is defined and
        need_reconnect_orch and
        ('Агент уже зарегистрирован' not in (final_registration_result.stdout | default('')))