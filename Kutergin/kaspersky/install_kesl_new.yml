    #   After=network-online.target
    #   Wants=network-online.target
    #   After=kesl.service
    #   Wants=kesl.service
    #   #After=klnagent.service
    #   #Wants=klnagent.service

    #   [Service]
    #   Type=forking
    #   Restart=no
    #   TimeoutSec=5min
    #   IgnoreSIGPIPE=no
    #   KillMode=process
    #   GuessMainPID=no
    #   RemainAfterExit=yes
    #   SuccessExitStatus=5 6
    #   ExecStart=/etc/rc.d/init.d/vipnet-ids-hs-watcher start
    #   ExecStop=/etc/rc.d/init.d/vipnet-ids-hs-watcher stop
    # agent_name: "vipnet-ids-hs-agent.service"
    # watcher_naem: "vipnet-ids-hs-watcher.service"
    files:
      klnagent: klnagent64-15.1.0-20748.x86_64.rpm
      kesl: kesl-12.2.0-2412.x86_64.rpm
      kesl_gui: kesl-gui-12.2.0-2412.x86_64.rpm
      conf1: autoanswers.txt
      conf2: autoinstall.ini
      # Добавляем переменные для DEB-пакетов
      klnagent_deb: klnagent64_15.2.0-442_amd64.deb
      kesl_deb: kesl_12.2.0-2412_amd64.deb
      kesl_gui_deb: kesl-gui_12.2.0-2412_amd64.deb


  vars_prompt:
    - name: input1
      prompt: "Настроить klnagent64? (y/n)"
      private: no

    - name: input2
      prompt: "Настроить kesl? (y/n)"
      private: no

  tasks:

    - name: Проверка наличия пакетного менеджера dpkg
      stat:
        path: /usr/bin/dpkg
      register: dpkg_check

    - name: Вывод результата проверки dpkg
      debug:
        msg: "Пакетный менеджер dpkg {{ 'найден' if dpkg_check.stat.exists else 'не найден' }}"

    - name: Проверка установлен ли drweb-agent
      shell: rpm -qa | grep drweb-esagent
      register: drweb_installed
      ignore_errors: yes 
      when: not dpkg_check.stat.exists

    - name: Проверить, существует ли папка /opt/drweb
      stat:
        path: /opt/drweb.com
      register: folder_result_drweb
      ignore_errors: yes
      when: dpkg_check.stat.exists

    - name: Удаление drweb
      shell: echo "Y" | sh /opt/drweb.com/bin/uninst.sh 
      register: drweb_unistall
      ignore_errors: no
      when: "'drweb-esagent' in drweb_installed.stdout or dpkg_check.stat.exists"

    - name: Проверка удаления drweb
      debug:
        msg: "{{ drweb_unistall.stdout_lines }}"
      when: "'drweb-esagent' in drweb_installed.stdout or dpkg_check.stat.exists"

    - name: Проверка установлен ли kesl
      shell: rpm -qa | grep kesl 
      register: kesl_installed
      ignore_errors: yes
      when: 
        - (drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")
        - not dpkg_check.stat.exists

    - name: Установлен ли пакет kaspersky (dpkg)
      stat:
        path: /opt/kaspersky/kesl
      register: folder_result_kasper
      ignore_errors: yes
      when: dpkg_check.stat.exists
    
    - name: Копирование папки KESL (RPM)
      copy:
        src: "{{way}}"
        dest: "{{way2}}"
      become: no
      when: ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed is defined) and not dpkg_check.stat.exists

    - name: Копирование папки KESL (DEB)
      copy:
        src: "{{way3}}"
        dest: "{{way4}}"
      become: no
      when: 
        - ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout"))
        - (folder_result_kasper is defined) and (folder_result_kasper.stat is defined) and folder_result_kasper.stat.exists
        - dpkg_check.stat.exists

    - name: Установка {{files.klnagent}} {{files.kesl}} {{files.kesl_gui}} (RPM)
      dnf:
        name:
          - "{{ way2 }}{{ files.klnagent }}"
          - "{{ way2 }}{{ files.kesl }}"
          - "{{ way2 }}{{ files.kesl_gui }}"
        state: present
        disable_gpg_check: yes
      when:
        - not dpkg_check.stat.exists
        - (drweb_unistall is not defined) or ('Подготовка пакетов...' in drweb_unistall.stdout | default(''))
        - kesl_installed.stdout | default('') == ''

    - name: Установка {{files.klnagent_deb}} {{files.kesl_deb}} {{files.kesl_gui_deb}} (DEB)
      apt:
        deb: "{{ item }}"
      loop:
        - '{{way4}}{{files.klnagent_deb}}'
        - '{{way4}}{{files.kesl_deb}}'
        - '{{way4}}{{files.kesl_gui_deb}}'
      when: 
        - ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (folder_result_kasper.stat.exists)
        - dpkg_check.stat.exists

    - name: Утсновка зависимостей perl
      dnf:
        name:
          - perl
          - curl
        state: present
        disable_gpg_check: yes
      when: 
        - ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (kesl_installed.stdout | default('') == '')
        - not dpkg_check.stat.exists

    - name: Установка зависимостей perl (DEB)
      apt:
        name:
          - perl
          - curl
        state: present
      when: 
        - ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (folder_result_kasper.stat.exists)
        - dpkg_check.stat.exists

    - name: Настройка klnagent64
      shell: "KLAUTOANSWERS={{way2}}{{files.conf1}} /opt/kaspersky/klnagent64/lib/bin/setup/postinstall.pl"
      register: res1
      when: input1 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (kesl_installed.stdout | default('') == '')

    - name: Настройка kesl
      shell: "/opt/kaspersky/kesl/bin/kesl-setup.pl --autoinstall={{way2}}{{files.conf2}}"
      register: res2
      when: input2 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (kesl_installed.stdout | default('') == '')

    - name: Результат настройки klnagent64
      debug:
        msg: "{{res1.stdout.split('\n')}}"
      when: input1 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (kesl_installed.stdout | default('') == '')

    - name: Результат настройки kesl
      debug:
        msg: "{{ res2.stdout.split('\n')}}"
      when: input2 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout)) and (kesl_installed.stdout | default('') == '')