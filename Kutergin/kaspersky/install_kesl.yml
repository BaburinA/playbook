---
- name: Установка Kaspersky
  hosts: all
  gather_facts: no
  become: yes
  vars:
    way: /home/distribution/szi-for-linux/KESL/
    way2: /home/{{ansible_user}}/KESL/
    new_config_agent: |
      # Automatically generated by systemd-sysv-generator

      [Unit]
      Documentation=man:systemd-sysv-generator(8)
      SourcePath=/etc/rc.d/init.d/vipnet-ids-hs-agent
      Description=LSB: ViPNet IDS HS Agent
      Before=multi-user.target
      Before=multi-user.target
      Before=multi-user.target
      Before=graphical.target
      After=network-online.target
      Wants=network-online.target
      After=kesl.service
      Wants=kesl.service
      #After=klnagent.service
      #Wants=klnagent.service

      [Service]
      Type=forking
      Restart=no
      TimeoutSec=5min
      IgnoreSIGPIPE=no
      KillMode=process
      GuessMainPID=no
      RemainAfterExit=yes
      SuccessExitStatus=5 6
      ExecStart=/etc/rc.d/init.d/vipnet-ids-hs-agent start
      ExecStop=/etc/rc.d/init.d/vipnet-ids-hs-agent stop
    new_config_watcher: |
      # Automatically generated by systemd-sysv-generator

      [Unit]
      Documentation=man:systemd-sysv-generator(8)
      SourcePath=/etc/rc.d/init.d/vipnet-ids-hs-watcher
      Description=LSB: ViPNet IDS HS Watcher
      Before=multi-user.target
      Before=multi-user.target
      Before=multi-user.target
      Before=graphical.target
      After=network-online.target
      Wants=network-online.target
      After=kesl.service
      Wants=kesl.service
      #After=klnagent.service
      #Wants=klnagent.service

      [Service]
      Type=forking
      Restart=no
      TimeoutSec=5min
      IgnoreSIGPIPE=no
      KillMode=process
      GuessMainPID=no
      RemainAfterExit=yes
      SuccessExitStatus=5 6
      ExecStart=/etc/rc.d/init.d/vipnet-ids-hs-watcher start
      ExecStop=/etc/rc.d/init.d/vipnet-ids-hs-watcher stop
    agent_name: "vipnet-ids-hs-agent.service"
    watcher_naem: "vipnet-ids-hs-watcher.service"
    files:
      klnagent: klnagent64-15.1.0-20748.x86_64.rpm
      kesl: kesl-12.2.0-2412.x86_64.rpm
      kesl_gui: kesl-gui-12.2.0-2412.x86_64.rpm
      conf1: autoanswers.txt
      conf2: autoinstall.ini

  vars_prompt:
    - name: input1
      prompt: "Настроить klnagent64? (y/n)"
      private: no

    - name: input2
      prompt: "Настроить kesl? (y/n)"
      private: no

  tasks:
    - name: Проверка установлен ли drweb-agent
      shell: rpm -qa | grep drweb-esagent
      register: drweb_installed
      ignore_errors: yes 
     

    - name: Удаление drweb
      shell: echo "Y" | sh /opt/drweb.com/bin/uninst.sh 
      register: drweb_unistall
      ignore_errors: no
      when: "'drweb-esagent' in drweb_installed.stdout"

    - name: Проверка удаления drweb
      debug:
        msg: "{{ drweb_unistall.stdout_lines }}"
      when: "'drweb-esagent' in drweb_installed.stdout"

    - name: Проверка установлен ли kesl
      shell: rpm -qa | grep kesl 
      register: kesl_installed
      ignore_errors: yes
      when: (drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")
            
    - name: Копирование папки KESl
      copy:
        src: "{{way}}"
        dest: "{{way2}}"
      become: no
      when: ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed is defined)
  

    - name: Установка {{files.klnagent}} {{files.kesl}} {{files.kesl_gui}} 
      dnf:
        name:
          - '{{way2}}{{files.klnagent}}'
          - '{{way2}}{{files.kesl}}'
          - '{{way2}}{{files.kesl_gui}}'
        state: present
        disable_gpg_check: yes
      when: ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')
        
    - name: Утсновка зависимостей perl
      dnf:
        name:
          - perl
          - curl
        state: present
        disable_gpg_check: yes
      when: ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')
        

    - name: Настройка klnagent64
      shell: "KLAUTOANSWERS={{way2}}{{files.conf1}} /opt/kaspersky/klnagent64/lib/bin/setup/postinstall.pl"
      register: res1
      when: input1 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')

    - name: Настройка kesl
      shell: "/opt/kaspersky/kesl/bin/kesl-setup.pl --autoinstall={{way2}}{{files.conf2}}"
      register: res2
      when: input2 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')

    - name: Результат настройки klnagent64
      debug:
        msg: "{{res1.stdout.split('\n')}}"
      when: input1 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')

    - name: Результат настройки kesl
      debug:
        msg: "{{ res2.stdout.split('\n')}}"
      when: input2 | default('n') == 'y' and ((drweb_unistall is not defined) or ("'Подготовка пакетов...' in drweb_unistall.stdout")) and (kesl_installed.stdout | default('') == '')

